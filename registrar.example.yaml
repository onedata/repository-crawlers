# Example configuration for `registrar` (apps/registrar).
#
# Resolution order, lowest → highest:
#   1. built-in defaults (equal to the values in this example)
#   2. environment variables (REGISTRAR_* with `__` for nested keys,
#      e.g. REGISTRAR_TOKENS__ADMIN_TOKEN)
#   3. this YAML, passed via `-c FILE` or `--config FILE`
#   4. CLI flags
#
# Run `registrar register --help` to see every flag, its env var, and
# its YAML key annotated together.
#
# Copy this file to e.g. `registrar.yaml` and customise. Only set what
# differs from the defaults — every key here is optional.


# ─── Connection ──────────────────────────────────────────────────────────────
onedata:
  onezone_domain: demo.onedata.org
  # The Oneprovider service that will register the crawled files by
  # referencing a remote, read-only HTTP storage
  oneprovider_domain: provider.demo.onedata.org
  oneprovider_panel_port: 443
  verify_ssl: true
  # HTTP request timeout in seconds for Onezone, Oneprovider, and Onepanel API calls.
  # Consider increasing if you are using the emulateRangeRead option with
  # HTTP resources that are large or take a long time to be retrieved.
  timeout: 30


# ─── Authentication ──────────────────────────────────────────────────────────
# Prefer environment variables over YAML for tokens — the values land in
# logs and shell history less easily that way.
#
#   export REGISTRAR_TOKENS__ADMIN_TOKEN="MDAxZWxvY2F00aW9uIGRlb..."
#   export REGISTRAR_TOKENS__SPACE_OWNER_TOKEN="MDAxZWxvY2F00aW9uIGRlb..."
tokens:
  admin_token: ""        # Onepanel admin (storage/support operations)
  space_owner_token: ""  # Onezone/Oneprovider user (spaces, files, shares, handles)


# ─── Target selection (used by 'register' subcommand only) ───────────────────
# Pick the destination space — by name (use-or-create) OR by ID
# (use-existing). At most one of `name`/`id` may be set; leaving both
# empty makes the registrar infer the space name from the first file
# URL in the dataset input.
space:
  # name: "preexisting-space"
  # id: "e9d570d9..."

# Pick the storage backing the space. Same name-or-id rule. When neither
# is set the registrar reuses the single compatible HTTP readonly
# storage already supporting the space, or creates one named after the
# space.
storage:
  # name: "preexisting-storage"
  # id: "fd559571..."

# HTTP-storage parameters applied when this run creates a storage, and
# validated against the chosen pre-existing storage when one is reused.
# Mismatches abort the plan with an actionable error.
storage_options:
  # Support size in bytes used when this run adds storage support for the
  # resolved space. Default: 1 TiB.
  default_size: 1099511627776

  # Emulate HTTP Range requests for servers that lack native Range
  # support. Significant performance hit — every read downloads the
  # whole file. When validating an existing storage, this must match
  # exactly or planning aborts.
  emulate_range_read: false

  # Maximum file size in bytes accessible from servers without Range
  # support. Active only when `emulate_range_read` is true.
  # Leave unset (null) to defer to the storage's own value, or — at
  # create time — to the Onepanel default. When set, the chosen
  # pre-existing storage must allow at least this much.
  # max_emulated_range_read_file_size: 1073741824

# Relative path inside the space where dataset directories will be created.
dataset_root: "./"


# ─── Public-data records ─────────────────────────────────────────────────────
public_data_records:
  # Create a public data record for every dataset that is registered.
  # A public data record is an extension of Onedata share that carries
  # metadata (e.g. DublinCore, DataCite) and is assigned a persistent
  # identifier. If set to false, only basic Onedata shares will be created.
  enabled: true

  # Onedata handle service ID where the public data records will be registered.
  # Required when enabled is true.
  handle_service_id: ""

  # Determines what kind of identifiers will be minted:
  #   onedata-url — a persistent URL issued by Onedata; reuses the share's public URL.
  #   pid         — a Persistent Identifier (e.g. DOI / Handle), requested from the configured handle service.
  record_identifier_type: onedata-url

  # The policy regarding identifier generation and reuse. Influences how
  # the per-dataset `pid` attributes are treated (found in the input — crawled datasets):
  #   always-generate-new      — ignore input PIDs, always overwrite with newly minted ones.
  #   always-reuse-existing    — every dataset must include a non-empty PID to reuse.
  #   generate-new-if-missing  — reuse when present, mint otherwise.
  #   amend-metadata           — reuse when present and update the metadata, mint otherwise.
  identifier_policy: generate-new-if-missing


# ─── Output and logging ──────────────────────────────────────────────────────
output:
  dir: ./data

logging:
  level: info       # debug | info | warning | error | silent
  quiet: false      # warnings, errors, and the final summary only
  verbose: false    # debug-level output (overrides `quiet`)
